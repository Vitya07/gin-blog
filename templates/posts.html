<!-- templates/posts.html -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Мой блог</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <h1>Мой блог</h1>

  <!-- Форма создания поста -->
  <form method="POST" action="/posts">
    <h2>Новый пост</h2>
    <input type="text" name="title" placeholder="Заголовок" required minlength="3" />
    <br /><br />
    <textarea name="body" placeholder="Текст поста" required minlength="10"></textarea>
    <br /><br />
    <button type="submit">Создать пост</button>
  </form>

  <hr />

  <!-- Список постов -->
  <h2>Все посты ({{$.TotalCount}})</h2>
  {{if $.Posts}} {{range .Posts}}
  <div class="post">
    <div class="post-content">
      <h3>{{.Title}}</h3>
      <p>{{.Body}}</p>
    </div>
    <!-- Кнопка удаления -->
    <div class="post-actions">
      <form method="POST" action="/posts/{{.ID}}/delete" style="display: inline">
        <button type="submit" class="delete-btn" onclick="return confirm('Удалить пост?')">
          Удалить
        </button>
      </form>
    </div>
  </div>
  {{end}} {{else}}
  <p>Пока нет постов.</p>
  {{end}}
</body>

</html>
